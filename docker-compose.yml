# ============================================================
# Tata CLiQ E-Commerce Clone — Local Development Stack
# Usage: docker compose up --build
# ============================================================

services:

  # ----------------------------------------------------------
  # SQL Server 2022
  # ----------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tatacliq-sqlserver
    environment:
      SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:-YourStr0ngP@ssword!}
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -Q 'SELECT 1' -b -No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - tatacliq-net

  # ----------------------------------------------------------
  # Redis 7 — catalog cache (Phase 13)
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tatacliq-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - tatacliq-net

  # ----------------------------------------------------------
  # Auth.API — :5001
  # ----------------------------------------------------------
  auth-api:
    build:
      context: ./backend
      dockerfile: src/Services/TataCliq.Auth.API/Dockerfile
    container_name: tatacliq-auth-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TataCliqDb;User Id=sa;Password=${SQLSERVER_SA_PASSWORD:-YourStr0ngP@ssword!};TrustServerCertificate=True"
    ports:
      - "5001:80"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - tatacliq-net

  # ----------------------------------------------------------
  # User.API — :5002
  # ----------------------------------------------------------
  user-api:
    build:
      context: ./backend
      dockerfile: src/Services/TataCliq.User.API/Dockerfile
    container_name: tatacliq-user-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TataCliqDb;User Id=sa;Password=${SQLSERVER_SA_PASSWORD:-YourStr0ngP@ssword!};TrustServerCertificate=True"
    ports:
      - "5002:80"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - tatacliq-net

  # ----------------------------------------------------------
  # Catalog.API — :5003
  # ----------------------------------------------------------
  catalog-api:
    build:
      context: ./backend
      dockerfile: src/Services/TataCliq.Catalog.API/Dockerfile
    container_name: tatacliq-catalog-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TataCliqDb;User Id=sa;Password=${SQLSERVER_SA_PASSWORD:-YourStr0ngP@ssword!};TrustServerCertificate=True"
      ConnectionStrings__Redis: "redis:6379"
    ports:
      - "5003:80"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - tatacliq-net

  # ----------------------------------------------------------
  # Cart.API — :5004
  # ----------------------------------------------------------
  cart-api:
    build:
      context: ./backend
      dockerfile: src/Services/TataCliq.Cart.API/Dockerfile
    container_name: tatacliq-cart-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TataCliqDb;User Id=sa;Password=${SQLSERVER_SA_PASSWORD:-YourStr0ngP@ssword!};TrustServerCertificate=True"
    ports:
      - "5004:80"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - tatacliq-net

  # ----------------------------------------------------------
  # Order.API — :5005
  # ----------------------------------------------------------
  order-api:
    build:
      context: ./backend
      dockerfile: src/Services/TataCliq.Order.API/Dockerfile
    container_name: tatacliq-order-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TataCliqDb;User Id=sa;Password=${SQLSERVER_SA_PASSWORD:-YourStr0ngP@ssword!};TrustServerCertificate=True"
    ports:
      - "5005:80"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - tatacliq-net

  # ----------------------------------------------------------
  # Admin.API — :5009
  # ----------------------------------------------------------
  admin-api:
    build:
      context: ./backend
      dockerfile: src/Services/TataCliq.Admin.API/Dockerfile
    container_name: tatacliq-admin-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TataCliqDb;User Id=sa;Password=${SQLSERVER_SA_PASSWORD:-YourStr0ngP@ssword!};TrustServerCertificate=True"
    ports:
      - "5009:80"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - tatacliq-net

  # ----------------------------------------------------------
  # Seller.API — :5010
  # ----------------------------------------------------------
  seller-api:
    build:
      context: ./backend
      dockerfile: src/Services/TataCliq.Seller.API/Dockerfile
    container_name: tatacliq-seller-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TataCliqDb;User Id=sa;Password=${SQLSERVER_SA_PASSWORD:-YourStr0ngP@ssword!};TrustServerCertificate=True"
    ports:
      - "5010:80"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - tatacliq-net

  # ----------------------------------------------------------
  # Gateway.API — :5000 (entry point for all clients)
  # ----------------------------------------------------------
  gateway-api:
    build:
      context: ./backend
      dockerfile: src/Services/TataCliq.Gateway.API/Dockerfile
    container_name: tatacliq-gateway-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      ReverseProxy__Clusters__auth-cluster__Destinations__auth__Address: "http://auth-api:80/"
      ReverseProxy__Clusters__user-cluster__Destinations__user__Address: "http://user-api:80/"
      ReverseProxy__Clusters__catalog-cluster__Destinations__catalog__Address: "http://catalog-api:80/"
      ReverseProxy__Clusters__cart-cluster__Destinations__cart__Address: "http://cart-api:80/"
      ReverseProxy__Clusters__order-cluster__Destinations__order__Address: "http://order-api:80/"
      ReverseProxy__Clusters__admin-cluster__Destinations__admin__Address: "http://admin-api:80/"
      ReverseProxy__Clusters__seller-cluster__Destinations__seller__Address: "http://seller-api:80/"
    ports:
      - "5000:80"
    depends_on:
      auth-api:
        condition: service_healthy
      user-api:
        condition: service_healthy
      catalog-api:
        condition: service_healthy
      cart-api:
        condition: service_healthy
      order-api:
        condition: service_healthy
      admin-api:
        condition: service_healthy
      seller-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - tatacliq-net

  # ----------------------------------------------------------
  # Angular SPA — :4200
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: tatacliq-frontend
    environment:
      - NODE_ENV=development
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - tatacliq-net
    depends_on:
      gateway-api:
        condition: service_healthy

volumes:
  sqlserver_data:
  redis_data:

networks:
  tatacliq-net:
    driver: bridge
